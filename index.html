<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerduNica · Agenda de Pedidos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>VerduNica</h1>
    <p id="store-name" class="store-name">Mercado de Siuna</p>
    <p class="tagline">Agenda digital de verduras y frutas · Siuna</p>
    <div class="session-control">
      <button type="button" id="btn-login" class="btn-secondary">Acceso vendedor</button>
      <button type="button" id="btn-logout" class="btn-secondary">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section id="vista-tiendas" aria-labelledby="tiendas-title">
      <h2 id="tiendas-title" class="tiendas-title">Encuentra tu tienda</h2>
      <input type="search" id="search-tienda" class="search-input" placeholder="Introduce el nombre de la tienda">
      <div id="tienda-grid" class="catalog-grid"></div>
    </section>

    <section id="catalogo" aria-labelledby="catalogo-title">
      <h2 id="catalogo-title">Catálogo</h2>
      <button type="button" id="btn-volver" class="btn-secondary">← Volver a las tiendas</button>
      <input type="search" id="search-input" class="search-input" placeholder="Buscar producto...">
      <div id="catalog-grid" class="catalog-grid"></div>
      <p id="error-log" class="error-log" role="alert"></p>
    </section>

    <section id="registro" aria-labelledby="registro-title">
      <h2 id="registro-title">Registro de Inventario</h2>
      <form id="product-form" class="product-form">
        <label>
          Nombre
          <input type="text" id="input-name" name="name" required>
        </label>

        <label>
          Precio (Córdobas)
          <input type="number" id="input-price" name="price" min="0" step="0.01" required>
        </label>

        <label>
          Categoría
          <select id="input-category" name="category" required>
            <option value="fruta">fruta</option>
            <option value="verdura">verdura</option>
            <option value="planta/hierba">planta/hierba</option>
            <option value="raiz/tuberculo">raíz/tubérculo</option>
          </select>
        </label>

        <label>
          Imagen (URL o Base64)
          <input type="text" id="input-image" name="image">
        </label>

        <label class="checkbox">
          <input type="checkbox" id="input-delivery" name="delivery">
          Disponibilidad de envío
        </label>

        <label>
          Ubicación (tramo/vendedor)
          <input type="text" id="input-location" name="location" required>
        </label>

        <label>
          Teléfono (WhatsApp)
          <input type="tel" id="input-phone" name="phone" required>
        </label>

        <button type="submit" class="btn-primary">Guardar producto</button>
      </form>
    </section>

    <section id="tab-vendedores" aria-labelledby="admin-title">
      <h2 id="admin-title">Gestión de Inventario</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Envío</th>
            <th id="th-actions">Acciones</th>
          </tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
